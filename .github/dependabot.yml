# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Go module dependencies
  - package-ecosystem: "gomod"
    open-pull-requests-limit: 10
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "11:00"
    commit-message:
      prefix: 'chore(deps)'
    # Group minor and patch updates
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "go"
  # GitHub Actions
  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 10
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
      day: "tuesday"
      time: "11:00"
    commit-message:
      prefix: 'chore(deps)'
    # Group minor and patch updates
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "github-actions"
  # The Go builder image in Dockerfile, pinned by digest
  - package-ecosystem: "docker"
    directory: "/"
    # Daily (Dependabot runs it Monday to Friday), unlike the others, so a Go
    # security patch reaches the image within a working day.
    schedule:
      interval: "daily"
      time: "11:00"
    commit-message:
      prefix: 'chore(deps)'
    allow:
      - dependency-name: "golang"
    # Only patch bumps; TestDockerfileBuildsWithTheGoInGoMod fails until go.mod moves too.
    ignore:
      - dependency-name: "golang"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels:
      - "dependencies"
      - "docker"
  # Docker Compose images
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "11:00"
    commit-message:
      prefix: 'chore(deps)'
    # The other images are built locally or set from a variable
    allow:
      - dependency-name: "rustfs/rustfs"
    labels:
      - "dependencies"
      - "docker"
