documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - 'docs/**'

go:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.go'

github-actions:
  - changed-files:
      - any-glob-to-any-file: '.github/**'

helm:
  - changed-files:
      - any-glob-to-any-file:
          - 'charts/**'
          - 'scripts/*helm*'
          - '.github/workflows/helm-chart*.yml'
