name: Docker

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      platforms:
        required: true
        type: string
      assert:
        type: boolean
        default: false
      flow_name:
        required: true
        type: string
      trail_name:
        required: true
        type: string
      kosli_org:
        required: true
        type: string
      checkout_ref:
        required: false
        type: string
        default: ''
      report_to_kosli:
        required: false
        type: string
        default: 'none'
    secrets:
      kosli_api_token:
        required: true
      snyk_token:
        required: true


env:
  IMAGE: ghcr.io/kosli-dev/cli
  # KOSLI_DRY_RUN: "True"
  # Ordinarily we declare KOSLI_ORG and KOSLI_FLOW here but
  # this interferes with the CLI integration tests


jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Resolve the platforms input into a JSON matrix, and the version the
  # built binary reports.
  #
  # Why a separate job: workflow-level matrix entries must be static or come
  # from job outputs; they cannot be computed inline from an input string.
  #
  # To support a new platform, add one entry to RUNNER_MAP below.
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Build matrix JSON from platforms input
        id: set-matrix
        env:
          PLATFORMS: ${{ inputs.platforms }}
          RUNNER_MAP: |
            {
              "linux/amd64": "ubuntu-latest",
              "linux/arm64": "ubuntu-24.04-arm"
            }
        run: |
          MATRIX=$(echo "$PLATFORMS" \
            | tr ',' '\n' \
            | jq -Rsc --argjson map "$RUNNER_MAP" '
                split("\n") |
                map(select(length > 0) | ltrimstr(" ") | rtrimstr(" ")) |
                map(
                  . as $p |
                  if ($map | has($p)) then {
                    platform: $p,
                    runner:   $map[$p],
                    slug:     ($p | gsub("/"; "-"))
                  } else
                    error("Unsupported platform \($p). Add it to RUNNER_MAP in docker.yml.")
                  end
                )
              ')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

      # Resolved once and read by both the build arg and the smoke test, so the
      # baked version and the asserted one cannot drift apart (#1133).
      - name: Resolve the version to build
        id: set-version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # A version tag is reported as-is; any other tag is a dev build.
          # Loose on purpose: ^v[0-9] also accepts the -rc tags this repo cuts.
          VERSION="$TAG"
          [[ "$TAG" =~ ^v[0-9] ]] || VERSION="dev+$TAG"
          echo "version=$VERSION" >> $GITHUB_OUTPUT


  # ---------------------------------------------------------------------------
  # Job 2: Build each platform on its native runner, push by digest.
  #
  # Native runners: building linux/arm64 via QEMU on an amd64 runner is
  # 5-10x slower than running it natively. Each leg pushes its image by digest
  # (not by tag) so the two images live in the registry without overwriting
  # each other. Digests are passed to the merge job via artifacts.
  # ---------------------------------------------------------------------------
  build:
    name: Docker Build (${{ matrix.platform }})
    needs: [prepare]
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          # No fetch-tags: the version arrives as a build arg, not from here.
          # .git/ ships in the build context, which mode=max exports to the
          # public cache ref.
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        # No QEMU needed — each runner is already native for its platform

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          # Push without a tag — the merge job creates the final manifest.
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Per-arch cache keeps amd64 and arm64 independent so a change on
          # one arch doesn't bust the other's cache.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.slug }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.slug }},mode=max

      - name: Export digest to file
        run: |
          if [ -z "$DIGEST" ]; then echo "::error::Build digest is empty"; exit 1; fi
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1


  # ---------------------------------------------------------------------------
  # Job 3: Merge per-arch digests into a single manifest, then run all
  # post-build steps (SBOM, Snyk, Kosli attestation, smoke test) once.
  # ---------------------------------------------------------------------------
  merge:
    name: Docker Merge & Attest
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      id-token: write
      contents: write
      attestations: write
      packages: write
      artifact-metadata: write
    env:
      RESULTS_FILE: smoke-test-results.json
      # Syft scans one platform. The image is multi-platform, so the SBOM covers
      # this one only, and the attestation records which.
      SBOM_PLATFORM: linux/amd64

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          # The smoke tests mount this workspace into a container.
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'
          check-latest: true

      - name: Download all digest artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: setup-kosli-cli
        uses: kosli-dev/setup-cli-action@9295a94031a6fc5eb1783a9027649a3cf7d1b950 # v5.2.4
        with:
          version: ${{ vars.KOSLI_CLI_VERSION }}

      - name: Create manifest and push
        id: docker_build
        env:
          IMAGE: ${{ env.IMAGE }}
          TAG: ${{ inputs.tag }}
        run: |
          # Read only files that look like sha256 hex digests — guards against
          # any stray files that might land in /tmp/digests unexpectedly.
          DIGEST_ARGS=$(find /tmp/digests -maxdepth 1 -type f \
            | grep -E '/[0-9a-f]{64}$' \
            | xargs -I{} basename {} \
            | sed "s|^|${IMAGE}@sha256:|" \
            | xargs)

          if [ -z "$DIGEST_ARGS" ]; then
            echo "::error::No valid digest files found in /tmp/digests"
            exit 1
          fi

          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            ${DIGEST_ARGS}

          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Make the image fingerprint available for following steps
        env:
          BUILD_DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: |
          ARTIFACT_SHA=$(echo "${BUILD_DIGEST}" | sed 's/.*://')
          echo "FINGERPRINT=$ARTIFACT_SHA" >> ${GITHUB_ENV}

      - name: Attest Build Provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          push-to-registry: true

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate SBOM for the docker image
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: |
          syft -q -o spdx-json --platform "${SBOM_PLATFORM}" \
            "registry:${IMAGE}@${DIGEST}" > sbom.spdx.json

          # Syft names the platform image it scanned, never the index ${DIGEST}
          # points at, so the subject has to be that platform's entry in it.
          expected=$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw \
            | jq -r --arg p "${SBOM_PLATFORM}" '
                .manifests[]?
                | select((.platform.os + "/" + .platform.architecture) == $p)
                | .digest')
          subject=$(jq -r '
            (.relationships[] | select(.relationshipType == "DESCRIBES") | .relatedSpdxElement) as $root
            | .packages[] | select(.SPDXID == $root)
            | .checksums[]? | select(.algorithm == "SHA256") | .checksumValue
          ' sbom.spdx.json)

          if [ -z "${expected}" ]; then
            echo "::error::${IMAGE}@${DIGEST} is not a multi-platform index listing ${SBOM_PLATFORM}"; exit 1
          fi
          if [ "sha256:${subject}" != "${expected}" ]; then
            echo "::error::sbom.spdx.json describes sha256:${subject}, not the ${SBOM_PLATFORM} image ${expected}"
            exit 1
          fi

      - name: Attest SBOM to Github
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: 'sbom.spdx.json'
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          push-to-registry: true

      - name: setup Snyk
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Report Docker image to Kosli
        if: ${{ inputs.report_to_kosli != 'none' }}
        env:
          KOSLI_API_TOKEN: ${{ secrets.kosli_api_token }}
        run:
          kosli attest artifact
             ${{ env.IMAGE }}:${{ inputs.tag }}
             --flow ${{ inputs.flow_name }}
             --trail ${{ inputs.trail_name }}
             --name cli-docker
             --fingerprint ${{ env.FINGERPRINT }}
             --external-url sigstore=https://search.sigstore.dev/?hash=${{ env.FINGERPRINT }}
             --org ${{ inputs.kosli_org }}

      - name: Report SBOM to Kosli
        if: ${{ inputs.report_to_kosli != 'none' }}
        env:
          KOSLI_API_TOKEN: ${{ secrets.kosli_api_token }}
        run:
          kosli attest sbom
            --flow ${{ inputs.flow_name }}
            --trail ${{ inputs.trail_name }}
            --name container-sbom
            --fingerprint ${{ env.FINGERPRINT }}
            --sbom-file sbom.spdx.json
            --annotate sbom_platform=${{ env.SBOM_PLATFORM }}
            --org ${{ inputs.kosli_org }}

      - name: Run Snyk Container Test to scan the Docker image for vulnerabilities
        env:
          SNYK_TOKEN: ${{ secrets.snyk_token }}
        run:
          snyk container test ${{ env.IMAGE }}@${{ steps.docker_build.outputs.digest }}
             --file=Dockerfile
             --sarif
             --policy-path=.snyk
             --sarif-file-output=snyk-docker.json

      - name: Report Snyk Docker scan results attestation to Kosli
        if: ${{ inputs.report_to_kosli != 'none' && (success() || failure()) }}
        env:
          KOSLI_API_TOKEN: ${{ secrets.kosli_api_token }}
        run:
          kosli attest snyk
              --flow ${{ inputs.flow_name }}
              --trail ${{ inputs.trail_name }}
              --fingerprint ${{ env.FINGERPRINT }}
              --name snyk-container-test
              --scan-results snyk-docker.json
              --org ${{ inputs.kosli_org }}

      - name: Run Docker image smoke tests
        if: ${{ success() || failure() }}
        env:
          IMAGE: ${{ env.IMAGE }}
          TAG: ${{ inputs.tag }}
          # The same value the build job baked in.
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./scripts/docker-smoke-tests.sh

      - name: Report Docker smoke test attestation to Kosli
        if: ${{ inputs.report_to_kosli != 'none' && (success() || failure()) }}
        env:
          KOSLI_API_TOKEN: ${{ secrets.kosli_api_token }}
        run: |
          if [ ! -s "$RESULTS_FILE" ]; then
            echo '[{"name":"smoke-tests","outcome":"failure","note":"runner produced no results"}]' > "$RESULTS_FILE"
          fi
          COMPLIANT=true
          jq -e 'length > 0 and all(.[]; .outcome == "success")' "$RESULTS_FILE" > /dev/null || COMPLIANT=false
          kosli attest generic \
            --flow ${{ inputs.flow_name }} \
            --trail ${{ inputs.trail_name }} \
            --fingerprint ${{ env.FINGERPRINT }} \
            --name smoke-test \
            --compliant="$COMPLIANT" \
            --attachments "$RESULTS_FILE" \
            --org ${{ inputs.kosli_org }}
