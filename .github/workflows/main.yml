name: Main

on:
  push:
    branches-ignore:
      - "dependabot/**"
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-build:
    # github.actor is who caused this event (e.g. the last push), not who
    # opened the PR, so check the PR author and that its branch is in this repo.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.prep.outputs.tag }}
      trail_name: ${{ steps.prep.outputs.trail_name }}
      trail_template_file: ${{ steps.prep.outputs.trail_template_file }}
      checkout_ref: ${{ steps.prep.outputs.checkout_ref }}
      report_to_kosli: ${{ steps.prep.outputs.report_to_kosli }}
      run_tests: ${{ steps.changes.outputs.run_tests }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare
        id: prep
        run: |
          if [ "${{ github.event_name }}" == "pull_request_target" ]; then
            SHA=${{ github.event.pull_request.head.sha }}
          else
            SHA=$GITHUB_SHA
          fi
          TAG=$(echo $SHA | head -c 8)
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "checkout_ref=$SHA" >> $GITHUB_OUTPUT

          if [ "${GITHUB_REF}" == refs/tags/* ]; then
            TRAIL_NAME=${GITHUB_REF##refs/tags/}
            TRAIL_TEMPLATE_FILE=release-flow-template.yml
          else
            TRAIL_NAME=$SHA
            TRAIL_TEMPLATE_FILE=main-flow-template.yml
          fi
          echo "TRAIL_NAME=${TRAIL_NAME}" >> $GITHUB_ENV
          echo "trail_name=$TRAIL_NAME" >> $GITHUB_OUTPUT

          echo "TRAIL_TEMPLATE_FILE=${TRAIL_TEMPLATE_FILE}" >> $GITHUB_ENV
          echo "trail_template_file=$TRAIL_TEMPLATE_FILE" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" == "push" ] && [ "${GITHUB_REF}" == "refs/heads/main" ]; then
            echo "report_to_kosli=all" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "push" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "report_to_kosli=release" >> $GITHUB_OUTPUT
          else
            echo "report_to_kosli=none" >> $GITHUB_OUTPUT
          fi

      - name: Decide whether the change needs the tests
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Paths that never reach a build or a test. Any other changed path runs everything.
          SKIPPABLE: >-
            ^(README\.md|CONTRIBUTING\.md|CODE_OF_CONDUCT\.md|SECURITY\.md|CLAUDE\.md|AUTHORS|LICENSE|TODO\.md|dev-guide\.md|release-guide\.md
            |(docs|design-docs|\.claude|\.github|charts|hack/empty-flag-audit/docs)/.*)$
        run: |
          # main always runs everything, so each of its Kosli trails gets every attestation.
          # Elsewhere the files count from where the branch left main, so an earlier code
          # change still counts; past the API's 300-file limit everything runs.
          run_tests=true
          if [ "${GITHUB_REF}" != "refs/heads/main" ] &&
            files=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${HEAD_SHA}" --jq \
              'if (.files | length) < 300 then .files[] | .filename, (.previous_filename // empty) else "too-many-files" end') &&
            [ -n "${files}" ] && ! grep -qvE "${SKIPPABLE// /}" <<<"${files}"; then
            run_tests=false
          fi
          echo "run_tests=${run_tests}" >> "$GITHUB_OUTPUT"

  init-kosli:
    needs: [pre-build]
    uses: ./.github/workflows/init_kosli.yml
    with:
      FLOW_NAME: cli
      TRAIL_NAME: ${{ needs.pre-build.outputs.trail_name }}
      FLOW_TEMPLATE_FILE: ${{ needs.pre-build.outputs.trail_template_file }}
      KOSLI_ORG: kosli-public
      checkout_ref: ${{ needs.pre-build.outputs.checkout_ref }}
      report_to_kosli: ${{ needs.pre-build.outputs.report_to_kosli }}
    secrets:
      kosli_api_token: ${{ secrets.KOSLI_PUBLIC_API_TOKEN }}
      pr_github_token: ${{ secrets.GITHUB_TOKEN }}

  test:
    needs: [pre-build, init-kosli]
    uses: ./.github/workflows/test.yml
    with:
      AWS_ACCOUNT_ID: 772819027869
      AWS_REGION: eu-central-1
      FLOW_NAME: cli
      TRAIL_NAME: ${{ needs.pre-build.outputs.trail_name }}
      KOSLI_ORG: kosli-public
      checkout_ref: ${{ needs.pre-build.outputs.checkout_ref }}
      report_to_kosli: ${{ needs.pre-build.outputs.report_to_kosli }}
      # Skipped jobs inside test.yml still report the required "test / Lint" and
      # "test / Test" checks, as passing; skipping this job would leave them pending.
      run_lint: ${{ needs.pre-build.outputs.run_tests == 'true' }}
      run_snyk: ${{ needs.pre-build.outputs.run_tests == 'true' }}
      run_test: ${{ needs.pre-build.outputs.run_tests == 'true' }}
      # Push events only. This workflow also runs on pull_request_target, where
      # github.ref is the base branch while checkout_ref is the PR head, so an
      # upload there would attribute PR findings to main. Tags never reach this
      # workflow (see branches-ignore above); release.yml leaves this unset.
      upload_sarif: ${{ github.event_name == 'push' }}
    secrets:
      github_access_token: ${{ secrets.KOSLI_GITHUB_TOKEN }}
      gitlab_access_token: ${{ secrets.KOSLI_GITLAB_TOKEN }}
      azure_access_token: ${{ secrets.KOSLI_AZURE_TOKEN }}
      azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      bitbucket_access_token: ${{ secrets.KOSLI_BITBUCKET_ACCESS_TOKEN }}
      jira_api_token: ${{ secrets.KOSLI_JIRA_API_TOKEN }}
      snyk_token: ${{ secrets.SNYK_TOKEN }}
      kosli_reporting_api_token: ${{ secrets.KOSLI_PUBLIC_API_TOKEN }}
      kosli_querying_api_token: ${{ secrets.KOSLI_API_TOKEN_PROD }}
      sonarqube_token: ${{ secrets.KOSLI_SONARQUBE_TOKEN }}

  docker:
    needs: [pre-build, test, init-kosli]
    if: ${{ needs.pre-build.outputs.run_tests == 'true' }}
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.pre-build.outputs.tag }}
      platforms: linux/amd64,linux/arm64
      flow_name: cli
      trail_name: ${{ needs.pre-build.outputs.trail_name }}
      kosli_org: kosli-public
      checkout_ref: ${{ needs.pre-build.outputs.checkout_ref }}
      report_to_kosli: ${{ needs.pre-build.outputs.report_to_kosli }}
    secrets:
      kosli_api_token: ${{ secrets.KOSLI_PUBLIC_API_TOKEN }}
      snyk_token: ${{ secrets.SNYK_TOKEN }}

  slack-notification-on-failure:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    needs:
      [
        pre-build,
        init-kosli,
        test,
        docker
      ]
    if: ${{ always() && contains(join(needs.*.result, ','), 'failure') && github.ref == 'refs/heads/main' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Slack Notification on Failure
        uses: kosli-dev/reusable-actions/.github/actions/send-ci-failure-slack-message@main
        with:
          slack_url: ${{ secrets.SLACK_CI_FAILURES_WEBHOOK }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
