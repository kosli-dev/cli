name: PR checks

on:
  pull_request: # support target PR changes for labelling
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read  # This is required for the label PR action
  pull-requests: write # This is required for the label PR action
  issues: write # Required to create new labels

jobs:
  validate-pr-title:
    # Run only when the PR comes from the same repository, not from a fork
    #if: github.event.pull_request.head.repo.full_name == github.repository
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: PR Conventional Commit Validation
        uses: ytanikin/pr-conventional-commits@639145d78959c53c43112365837e3abd21ed67c1 # 1.5.2
        with:
          task_types: '["feat","fix","docs","test","ci","refactor","perf","chore","revert"]'
          add_label: 'true'
          #custom_labels: '{"feat": "feature", "fix": "fix", "docs": "documentation", "test": "test", "ci": "CI/CD", "refactor": "refactor", "perf": "performance", "chore": "chore", "revert": "revert", "wip": "WIP"}'
          #add_scope_label: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
  labeler:
    # Run only when the PR comes from the same repository, not from a fork
    #if: github.event.pull_request.head.repo.full_name == github.repository
    name: Label PRs
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Label PRs
        id: label-prs
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
          configuration-path: ".github/labeler.yaml"
