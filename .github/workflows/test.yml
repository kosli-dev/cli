name: Test

on:
  workflow_call:
    inputs:
      AWS_ACCOUNT_ID:
        required: true
        type: string
      AWS_REGION:
        required: true
        type: string
      FLOW_NAME:
        required: true
        type: string
      TRAIL_NAME:
        required: true
        type: string
      KOSLI_ORG:
        required: true
        type: string
      run_lint:
        required: false
        type: boolean
        default: true
      run_snyk:
        required: false
        type: boolean
        default: true
      report_to_kosli:
        required: false
        type: string
        default: 'none'
      checkout_ref:
        required: false
        type: string
        default: ''
    secrets:
      slack_channel:
        required: true
      slack_webhook:
        required: true
      github_access_token:
        required: true
      gitlab_access_token:
        required: true
      azure_access_token:
        required: true
      azure_client_id:
        required: true
      azure_client_secret:
        required: true
      bitbucket_access_token:
        required: true
      jira_api_token:
        required: true
      snyk_token:
        required: true
      kosli_reporting_api_token:
        required: true
      kosli_querying_api_token:
        required: true
      sonarqube_token:
        required: true


jobs:
  lint:
    if: ${{ inputs.run_lint }}
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:

    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.checkout_ref || github.sha }}

    - uses: actions/setup-go@v7
      with:
        go-version-file: '.go-version'
        check-latest: true

    - name: setup-kosli-cli
      uses: kosli-dev/setup-cli-action@v5
      with:
        version:
          ${{ vars.KOSLI_CLI_VERSION }}

    - name: Run golangci-lint
      id: lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --timeout=5m -v

    - name: Report lint to Kosli
      if:  ${{ (success() || failure()) && inputs.report_to_kosli != 'none' }}
      env:
        KOSLI_API_TOKEN: ${{ secrets.kosli_reporting_api_token }}
      run: kosli attest generic
           --name lint
           --flow ${{ inputs.FLOW_NAME }}
           --trail ${{ inputs.TRAIL_NAME }}
           --org ${{ inputs.KOSLI_ORG }}
           --compliant=${{ steps.lint.outcome == 'success' }}

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:

    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # needed for some tests referencing older commits
        ref: ${{ inputs.checkout_ref || github.sha }}

    - uses: actions/setup-go@v7
      with:
        go-version-file: '.go-version'
        check-latest: true

    - name: setup-kosli-cli
      uses: kosli-dev/setup-cli-action@v5
      with:
        version:
          ${{ vars.KOSLI_CLI_VERSION }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::${{ inputs.AWS_ACCOUNT_ID }}:role/cli
        aws-region: ${{ inputs.AWS_REGION }}
        role-duration-seconds: 2400
        role-session-name: ${{ github.event.repository.name }}

    - name: Login to Amazon ECR private
      id: login-ecr-private
      uses: aws-actions/amazon-ecr-login@v2

    - name: Run tests
      env:
        KOSLI_GITHUB_TOKEN: ${{ secrets.github_access_token }}
        KOSLI_GITLAB_TOKEN: ${{ secrets.gitlab_access_token }}
        KOSLI_AZURE_TOKEN: ${{ secrets.azure_access_token }}
        KOSLI_BITBUCKET_ACCESS_TOKEN: ${{ secrets.bitbucket_access_token }}
        KOSLI_JIRA_API_TOKEN: ${{ secrets.jira_api_token }}
        KOSLI_JIRA_USERNAME: ${{ vars.KOSLI_JIRA_USERNAME }}
        INTEGRATION_TEST_AZURE_CLIENT_SECRET: ${{ secrets.azure_client_secret }}
        INTEGRATION_TEST_AZURE_CLIENT_ID: ${{ secrets.azure_client_id }}
        KOSLI_SONAR_API_TOKEN: ${{ secrets.sonarqube_token }}
        KOSLI_API_TOKEN_PROD: ${{ secrets.kosli_querying_api_token }}
        GH_TOKEN: ${{ secrets.github_access_token }}  # sonar tests download artifacts from cyber-dojo/differ
      run: |
        # some tests use git operations, therefore the git author on the CI VM needs to be set
        git config --global user.name "John Doe"
        git config --global user.email johndoe@example.com
        make test_integration_full

    - name: Report test to Kosli
      if:  ${{ (success() || failure()) && inputs.report_to_kosli != 'none' }}
      env:
        KOSLI_API_TOKEN: ${{ secrets.kosli_reporting_api_token }}
      run: kosli attest junit
           --name test
           --flow ${{ inputs.FLOW_NAME }}
           --trail ${{ inputs.TRAIL_NAME }}
           --results-dir junit-test-results
           --org ${{ inputs.KOSLI_ORG }}

    - name: Upload coverage reports to Codecov
      if: ${{ inputs.report_to_kosli != 'none' }}
      uses: codecov/codecov-action@v7

  snyk-code-test:
    if: ${{ inputs.run_snyk }}
    name: Snyk Code Test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      security-events: write  # upload SARIF to GitHub code scanning
    steps:

    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.checkout_ref || github.sha }}

    - name: setup Snyk
      uses: snyk/actions/setup@master

    - name: setup-kosli-cli
      uses: kosli-dev/setup-cli-action@v5
      with:
        version:
          ${{ vars.KOSLI_CLI_VERSION }}

    - name: Run Snyk to check source code for vulnerabilities
      env:
        SNYK_TOKEN: ${{ secrets.snyk_token }}
      run:
          snyk code test --sarif --policy-path=.snyk  --sarif-file-output=snyk-code.sarif --prune-repeated-subdependencies

    - name: Upload Snyk Code results to GitHub code scanning
      # snyk exits non-zero when it finds issues, so upload on failure too.
      # Branch pushes only: on pull_request_target (dependabot) github.ref is the
      # base branch while the checkout is the PR head, so uploading there would
      # attribute PR findings to main. Tag pushes (release.yml) are skipped - a
      # release tag is not a useful code scanning baseline.
      if: ${{ (success() || failure()) && github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        sarif_file: snyk-code.sarif
        category: snyk-code

    - name: Report Snyk Code to Kosli
      if:  ${{ (success() || failure()) && inputs.report_to_kosli != 'none' }}
      env:
        KOSLI_API_TOKEN: ${{ secrets.kosli_reporting_api_token }}
      run: kosli attest snyk
           --name snyk-code-test
           --flow ${{ inputs.FLOW_NAME }}
           --trail ${{ inputs.TRAIL_NAME }}
           --scan-results  snyk-code.sarif
           --org ${{ inputs.KOSLI_ORG }}

  snyk-dependency-test:
    if: ${{ inputs.run_snyk }}
    name: Snyk Dependency Test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:

    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.checkout_ref || github.sha }}

    - name: setup Snyk
      uses: snyk/actions/setup@master

    - name: setup-kosli-cli
      uses: kosli-dev/setup-cli-action@v5
      with:
        version:
          ${{ vars.KOSLI_CLI_VERSION }}

    - name: Run Snyk to check dependencies for vulnerabilities
      env:
        SNYK_TOKEN: ${{ secrets.snyk_token }}
      run:
          snyk test --sarif --policy-path=.snyk  --sarif-file-output=snyk-dependency.json --prune-repeated-subdependencies

    - name: Report Snyk Test to Kosli
      if:  ${{ (success() || failure()) && inputs.report_to_kosli != 'none' }}
      env:
        KOSLI_API_TOKEN: ${{ secrets.kosli_reporting_api_token }}
      run: kosli attest snyk
           --name snyk-dependency-test
           --flow ${{ inputs.FLOW_NAME }}
           --trail ${{ inputs.TRAIL_NAME }}
           --scan-results  snyk-dependency.json
           --org ${{ inputs.KOSLI_ORG }}
