name: Test

on:
  workflow_call:
    inputs:
      AWS_ACCOUNT_ID:
        required: true
        type: string
      AWS_REGION:
        required: true
        type: string
      FLOW_NAME:
        required: true
        type: string
      TRAIL_NAME:
        required: true
        type: string
      KOSLI_ORG:
        required: true
        type: string
      run_lint:
        required: false
        type: boolean
        default: true
      run_snyk:
        required: false
        type: boolean
        default: true
      run_test:
        required: false
        type: boolean
        default: true
      upload_sarif:
        required: false
        type: boolean
        default: false
      report_to_kosli:
        required: false
        type: string
        default: 'none'
      checkout_ref:
        required: false
        type: string
        default: ''
    secrets:
      github_access_token:
        required: true
      gitlab_access_token:
        required: true
      azure_access_token:
        required: true
      azure_client_id:
        required: true
      azure_client_secret:
        required: true
      bitbucket_access_token:
        required: true
      jira_api_token:
        required: true
      snyk_token:
        required: true
      kosli_reporting_api_token:
        required: true
      kosli_querying_api_token:
        required: true
      sonarqube_token:
        required: true


jobs:
  lint:
    if: ${{ inputs.run_lint }}
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:

    - name: Harden Runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.checkout_ref || github.sha }}

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: '.go-version'
        check-latest: true

    - name: setup-kosli-cli
      uses: kosli-dev/setup-cli-action@9295a94031a6fc5eb1783a9027649a3cf7d1b950 # v5.2.4
      with:
        version:
          ${{ vars.KOSLI_CLI_VERSION }}

    - name: Run golangci-lint
      id: lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: latest
        args: -v

    # setup-go's cache holds only Linux builds, so the macOS and Windows vet gets its own GOCACHE.
    - name: Restore the macOS and Windows vet cache
      id: vet-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/go-vet-cache
        key: go-vet-${{ runner.os }}-${{ hashFiles('.go-version', 'go.sum') }}
        restore-keys: go-vet-${{ runner.os }}-

    # Every other job builds tests only for Linux, and release builds skip _test.go files.
    # Linux is left out because golangci-lint above and make vet in the Test job already vet it.
    - name: Vet for macOS and Windows
      id: vet-all
      env:
        GOCACHE: ${{ runner.temp }}/go-vet-cache
      run: make vet_all VET_PLATFORMS="darwin windows"

    # Every branch can restore a cache saved on main, so only main writes one.
    - name: Save the macOS and Windows vet cache
      if: github.ref == 'refs/heads/main' && steps.vet-all.outcome == 'success' && steps.vet-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/go-vet-cache
        key: go-vet-${{ runner.os }}-${{ hashFiles('.go-version', 'go.sum') }}

    - name: Test the server image lookup
      run: ./hack/test-get-server-image.sh

    - name: Report lint to Kosli
      if:  ${{ (success() || failure()) && inputs.report_to_kosli != 'none' }}
      env:
        KOSLI_API_TOKEN: ${{ secrets.kosli_reporting_api_token }}
      run: kosli attest generic
           --name lint
           --flow ${{ inputs.FLOW_NAME }}
           --trail ${{ inputs.TRAIL_NAME }}
           --org ${{ inputs.KOSLI_ORG }}
           --compliant=${{ steps.lint.outcome == 'success' && steps.vet-all.outcome == 'success' }}

  test:
    if: ${{ inputs.run_test }}
    name: Test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:

    - name: Harden Runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # needed for some tests referencing older commits
        ref: ${{ inputs.checkout_ref || github.sha }}

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: '.go-version'
        check-latest: true

    - name: setup-kosli-cli
      uses: kosli-dev/setup-cli-action@9295a94031a6fc5eb1783a9027649a3cf7d1b950 # v5.2.4
      with:
        version:
          ${{ vars.KOSLI_CLI_VERSION }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: arn:aws:iam::${{ inputs.AWS_ACCOUNT_ID }}:role/cli
        aws-region: ${{ inputs.AWS_REGION }}
        role-duration-seconds: 2400
        role-session-name: ${{ github.event.repository.name }}

    - name: Login to Amazon ECR private
      id: login-ecr-private
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

    - name: Run tests
      env:
        KOSLI_GITHUB_TOKEN: ${{ secrets.github_access_token }}
        KOSLI_GITLAB_TOKEN: ${{ secrets.gitlab_access_token }}
        KOSLI_AZURE_TOKEN: ${{ secrets.azure_access_token }}
        KOSLI_BITBUCKET_ACCESS_TOKEN: ${{ secrets.bitbucket_access_token }}
        KOSLI_JIRA_API_TOKEN: ${{ secrets.jira_api_token }}
        KOSLI_JIRA_USERNAME: ${{ vars.KOSLI_JIRA_USERNAME }}
        INTEGRATION_TEST_AZURE_CLIENT_SECRET: ${{ secrets.azure_client_secret }}
        INTEGRATION_TEST_AZURE_CLIENT_ID: ${{ secrets.azure_client_id }}
        KOSLI_SONAR_API_TOKEN: ${{ secrets.sonarqube_token }}
        KOSLI_API_TOKEN_PROD: ${{ secrets.kosli_querying_api_token }}
        GH_TOKEN: ${{ secrets.github_access_token }}  # sonar tests download artifacts from cyber-dojo/differ
      run: |
        # some tests use git operations, therefore the git author on the CI VM needs to be set
        git config --global user.name "John Doe"
        git config --global user.email johndoe@example.com
        make test_integration_full

    - name: Report test to Kosli
      if:  ${{ (success() || failure()) && inputs.report_to_kosli != 'none' }}
      env:
        KOSLI_API_TOKEN: ${{ secrets.kosli_reporting_api_token }}
      run: kosli attest junit
           --name test
           --flow ${{ inputs.FLOW_NAME }}
           --trail ${{ inputs.TRAIL_NAME }}
           --results-dir junit-test-results
           --org ${{ inputs.KOSLI_ORG }}

    - name: Upload coverage reports to Codecov
      if: ${{ inputs.report_to_kosli != 'none' }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1

  snyk-code-test:
    if: ${{ inputs.run_snyk }}
    name: Snyk Code Test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      security-events: write 
    steps:

    - name: Harden Runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.checkout_ref || github.sha }}

    - name: setup Snyk
      uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

    - name: setup-kosli-cli
      uses: kosli-dev/setup-cli-action@9295a94031a6fc5eb1783a9027649a3cf7d1b950 # v5.2.4
      with:
        version:
          ${{ vars.KOSLI_CLI_VERSION }}

    - name: Run Snyk to check source code for vulnerabilities
      env:
        SNYK_TOKEN: ${{ secrets.snyk_token }}
      run:
          snyk code test --sarif --policy-path=.snyk  --sarif-file-output=snyk-code.sarif --prune-repeated-subdependencies

    - name: Upload Snyk Code results to GitHub code scanning

      if: ${{ (success() || failure()) && inputs.upload_sarif && hashFiles('snyk-code.sarif') != '' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: snyk-code.sarif
        category: snyk-code

    - name: Report Snyk Code to Kosli
      if:  ${{ (success() || failure()) && inputs.report_to_kosli != 'none' }}
      env:
        KOSLI_API_TOKEN: ${{ secrets.kosli_reporting_api_token }}
      run: kosli attest snyk
           --name snyk-code-test
           --flow ${{ inputs.FLOW_NAME }}
           --trail ${{ inputs.TRAIL_NAME }}
           --scan-results  snyk-code.sarif
           --org ${{ inputs.KOSLI_ORG }}

  snyk-dependency-test:
    if: ${{ inputs.run_snyk }}
    name: Snyk Dependency Test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:

    - name: Harden Runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.checkout_ref || github.sha }}

    - name: setup Snyk
      uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

    - name: setup-kosli-cli
      uses: kosli-dev/setup-cli-action@9295a94031a6fc5eb1783a9027649a3cf7d1b950 # v5.2.4
      with:
        version:
          ${{ vars.KOSLI_CLI_VERSION }}

    - name: Run Snyk to check dependencies for vulnerabilities
      env:
        SNYK_TOKEN: ${{ secrets.snyk_token }}
        # The unified test API path reports licence issues that .snyk ignores.
        SNYK_FORCE_LEGACY_CLI: "true"
      run:
          snyk test --sarif --policy-path=.snyk  --sarif-file-output=snyk-dependency.sarif --prune-repeated-subdependencies

    - name: Report Snyk Test to Kosli
      if:  ${{ (success() || failure()) && inputs.report_to_kosli != 'none' }}
      env:
        KOSLI_API_TOKEN: ${{ secrets.kosli_reporting_api_token }}
      run: kosli attest snyk
           --name snyk-dependency-test
           --flow ${{ inputs.FLOW_NAME }}
           --trail ${{ inputs.TRAIL_NAME }}
           --scan-results  snyk-dependency.sarif
           --org ${{ inputs.KOSLI_ORG }}
